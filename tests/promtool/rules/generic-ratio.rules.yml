# Prometheus rule file generated by ftw-slo 1.0.0 from generic-ratio.yaml.
# Do not edit by hand: change the SLO spec and run `ftw-slo generate` again.
groups:
  - name: ftw-slo:generic-ratio:objective-999:sli
    rules:
      - record: ftw_slo:sli_errors:rate5m
        expr: |-
          sum(rate(payments_failed_total{env="prod"}[5m]))
          or
          0 * sum(rate(payments_attempted_total{env="prod"}[5m]))
        labels:
          slo_service: generic-ratio
          slo: objective-999
      - record: ftw_slo:sli_total:rate5m
        expr: sum(rate(payments_attempted_total{env="prod"}[5m]))
        labels:
          slo_service: generic-ratio
          slo: objective-999
      - record: ftw_slo:sli_error:ratio_rate5m
        expr: |-
          ftw_slo:sli_errors:rate5m{slo_service="generic-ratio", slo="objective-999"}
          /
          ftw_slo:sli_total:rate5m{slo_service="generic-ratio", slo="objective-999"}
        labels:
          slo_service: generic-ratio
          slo: objective-999
      - record: ftw_slo:sli_error:ratio_rate30m
        expr: |-
          (
            sum(rate(payments_failed_total{env="prod"}[30m]))
            or
            0 * sum(rate(payments_attempted_total{env="prod"}[30m]))
          )
          /
          sum(rate(payments_attempted_total{env="prod"}[30m]))
        labels:
          slo_service: generic-ratio
          slo: objective-999
      - record: ftw_slo:sli_error:ratio_rate1h
        expr: |-
          (
            sum(rate(payments_failed_total{env="prod"}[1h]))
            or
            0 * sum(rate(payments_attempted_total{env="prod"}[1h]))
          )
          /
          sum(rate(payments_attempted_total{env="prod"}[1h]))
        labels:
          slo_service: generic-ratio
          slo: objective-999
      - record: ftw_slo:sli_error:ratio_rate2h
        expr: |-
          (
            sum(rate(payments_failed_total{env="prod"}[2h]))
            or
            0 * sum(rate(payments_attempted_total{env="prod"}[2h]))
          )
          /
          sum(rate(payments_attempted_total{env="prod"}[2h]))
        labels:
          slo_service: generic-ratio
          slo: objective-999
      - record: ftw_slo:sli_error:ratio_rate6h
        expr: |-
          (
            sum(rate(payments_failed_total{env="prod"}[6h]))
            or
            0 * sum(rate(payments_attempted_total{env="prod"}[6h]))
          )
          /
          sum(rate(payments_attempted_total{env="prod"}[6h]))
        labels:
          slo_service: generic-ratio
          slo: objective-999
      - record: ftw_slo:sli_error:ratio_rate1d
        expr: |-
          (
            sum(rate(payments_failed_total{env="prod"}[1d]))
            or
            0 * sum(rate(payments_attempted_total{env="prod"}[1d]))
          )
          /
          sum(rate(payments_attempted_total{env="prod"}[1d]))
        labels:
          slo_service: generic-ratio
          slo: objective-999
      - record: ftw_slo:sli_error:ratio_rate3d
        expr: |-
          (
            sum(rate(payments_failed_total{env="prod"}[3d]))
            or
            0 * sum(rate(payments_attempted_total{env="prod"}[3d]))
          )
          /
          sum(rate(payments_attempted_total{env="prod"}[3d]))
        labels:
          slo_service: generic-ratio
          slo: objective-999
  - name: ftw-slo:generic-ratio:objective-999:meta
    rules:
      - record: ftw_slo:sli_error:ratio_period
        expr: |-
          sum_over_time(ftw_slo:sli_errors:rate5m{slo_service="generic-ratio", slo="objective-999"}[30d])
          /
          sum_over_time(ftw_slo:sli_total:rate5m{slo_service="generic-ratio", slo="objective-999"}[30d])
        labels:
          slo_service: generic-ratio
          slo: objective-999
      - record: ftw_slo:error_budget_remaining:ratio
        expr: 1 - (ftw_slo:sli_error:ratio_period{slo_service="generic-ratio", slo="objective-999"} / 0.001)
        labels:
          slo_service: generic-ratio
          slo: objective-999
      - record: ftw_slo:objective:ratio
        expr: vector(0.999)
        labels:
          slo_service: generic-ratio
          slo: objective-999
      - record: ftw_slo:error_budget:ratio
        expr: vector(0.001)
        labels:
          slo_service: generic-ratio
          slo: objective-999
      - record: ftw_slo:period:days
        expr: vector(30)
        labels:
          slo_service: generic-ratio
          slo: objective-999
  - name: ftw-slo:generic-ratio:objective-999:alerts
    rules:
      - alert: Slo999FastBurn
        expr: |-
          (
            ftw_slo:sli_error:ratio_rate1h{slo_service="generic-ratio", slo="objective-999"} > (14.4 * 0.001)
            and
            ftw_slo:sli_error:ratio_rate5m{slo_service="generic-ratio", slo="objective-999"} > (14.4 * 0.001)
          )
        labels:
          severity: critical
          slo_alert: page
        annotations:
          summary: 'generic-ratio objective-999: error budget fast burn (page)'
          description: 'The generic-ratio objective-999 SLO (99.9% over 30d) is consuming its error budget too fast. Firing condition(s): 1h and 5m error ratio above 14.4x the budget (whole budget gone in 2.1 days at that rate).'
      - alert: Slo999SlowBurn
        expr: |-
          (
            ftw_slo:sli_error:ratio_rate6h{slo_service="generic-ratio", slo="objective-999"} > (6 * 0.001)
            and
            ftw_slo:sli_error:ratio_rate30m{slo_service="generic-ratio", slo="objective-999"} > (6 * 0.001)
          )
          or
          (
            ftw_slo:sli_error:ratio_rate1d{slo_service="generic-ratio", slo="objective-999"} > (3 * 0.001)
            and
            ftw_slo:sli_error:ratio_rate2h{slo_service="generic-ratio", slo="objective-999"} > (3 * 0.001)
          )
          or
          (
            ftw_slo:sli_error:ratio_rate3d{slo_service="generic-ratio", slo="objective-999"} > (1 * 0.001)
            and
            ftw_slo:sli_error:ratio_rate6h{slo_service="generic-ratio", slo="objective-999"} > (1 * 0.001)
          )
        labels:
          severity: warning
          slo_alert: ticket
        annotations:
          summary: 'generic-ratio objective-999: error budget slow burn (ticket)'
          description: 'The generic-ratio objective-999 SLO (99.9% over 30d) is consuming its error budget too fast. Firing condition(s): 6h and 30m error ratio above 6x the budget (whole budget gone in 5 days at that rate); 1d and 2h error ratio above 3x the budget (whole budget gone in 10 days at that rate); 3d and 6h error ratio above 1x the budget (whole budget gone in 30 days at that rate).'
