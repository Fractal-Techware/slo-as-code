      - expr: round(ftw_slo:error_budget_remaining:ratio{slo="objective-999", slo_service="generic-ratio"}, 0.000001)
        eval_time: 1d
        exp_samples:
          - labels: '{slo="objective-999", slo_service="generic-ratio"}'
