# promtool timing tests for SLI template generic-ratio (6 scenarios). Generated; do not edit.
# Run: promtool test rules generic-ratio.test.yml
rule_files:
  - rules/generic-ratio.rules.yml
evaluation_interval: 1m
tests:
  - name: 'generic-ratio 99.9%: fast burn (100% errors) pages within 3m'
    interval: 1m
    input_series:
      - series: payments_failed_total{env="prod", provider="a"}
        values: 0+0x360 1000+1000x59
      - series: payments_attempted_total{env="prod", provider="a"}
        values: 0+1000x420
    alert_rule_test:
      - eval_time: 6h
        alertname: Slo999FastBurn
        exp_alerts: []
      - eval_time: 6h
        alertname: Slo999SlowBurn
        exp_alerts: []
      - eval_time: 363m
        alertname: Slo999FastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: objective-999
              slo_alert: page
              slo_service: generic-ratio
            exp_annotations:
              summary: 'generic-ratio objective-999: error budget fast burn (page)'
              description: 'The generic-ratio objective-999 SLO (99.9% over 30d) is consuming its error budget too fast. Firing condition(s): 1h and 5m error ratio above 14.4x the budget (whole budget gone in 2.1 days at that rate).'
    promql_expr_test:
      - expr: ftw_slo:sli_error:ratio_rate5m{slo="objective-999", slo_service="generic-ratio"}
        eval_time: 390m
        exp_samples:
          - labels: ftw_slo:sli_error:ratio_rate5m{slo="objective-999", slo_service="generic-ratio"}
            value: 1
  - name: 'generic-ratio 99.9%: slow burn (2x budget) opens a ticket, does not page'
    interval: 1m
    input_series:
      - series: payments_failed_total{env="prod", provider="a"}
        values: 0+2x360
      - series: payments_attempted_total{env="prod", provider="a"}
        values: 0+1000x360
    alert_rule_test:
      - eval_time: 2h
        alertname: Slo999SlowBurn
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: objective-999
              slo_alert: ticket
              slo_service: generic-ratio
            exp_annotations:
              summary: 'generic-ratio objective-999: error budget slow burn (ticket)'
              description: 'The generic-ratio objective-999 SLO (99.9% over 30d) is consuming its error budget too fast. Firing condition(s): 6h and 30m error ratio above 6x the budget (whole budget gone in 5 days at that rate); 1d and 2h error ratio above 3x the budget (whole budget gone in 10 days at that rate); 3d and 6h error ratio above 1x the budget (whole budget gone in 30 days at that rate).'
      - eval_time: 2h
        alertname: Slo999FastBurn
        exp_alerts: []
      - eval_time: 6h
        alertname: Slo999SlowBurn
        exp_alerts:
          - exp_labels:
              severity: warning
