name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'

      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check "PyYAML>=5.4"

      - name: Pull Prometheus image (promtool)
        run: docker pull --quiet prom/prometheus:v3.14.0

      - name: unit tests + promtool check/test rules
        run: FTW_USE_DOCKER=1 ./run-tests.sh
