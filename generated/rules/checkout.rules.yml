# Prometheus rule file generated by ftw-slo 1.0.0 from checkout.yaml.
# Do not edit by hand: change the SLO spec and run `ftw-slo generate` again.
groups:
  - name: ftw-slo:checkout:availability:sli
    rules:
      - record: ftw_slo:sli_errors:rate5m
        expr: |-
          sum(rate(http_requests_total{job="checkout", handler!="/healthz", code=~"5.."}[5m]))
          or
          0 * sum(rate(http_requests_total{job="checkout", handler!="/healthz"}[5m]))
        labels:
          slo_service: checkout
          slo: availability
          team: payments
      - record: ftw_slo:sli_total:rate5m
        expr: sum(rate(http_requests_total{job="checkout", handler!="/healthz"}[5m]))
        labels:
          slo_service: checkout
          slo: availability
          team: payments
      - record: ftw_slo:sli_error:ratio_rate5m
        expr: |-
          ftw_slo:sli_errors:rate5m{slo_service="checkout", slo="availability"}
          /
          ftw_slo:sli_total:rate5m{slo_service="checkout", slo="availability"}
        labels:
          slo_service: checkout
          slo: availability
          team: payments
      - record: ftw_slo:sli_error:ratio_rate30m
        expr: |-
          (
            sum(rate(http_requests_total{job="checkout", handler!="/healthz", code=~"5.."}[30m]))
            or
            0 * sum(rate(http_requests_total{job="checkout", handler!="/healthz"}[30m]))
          )
          /
          sum(rate(http_requests_total{job="checkout", handler!="/healthz"}[30m]))
        labels:
          slo_service: checkout
          slo: availability
          team: payments
      - record: ftw_slo:sli_error:ratio_rate1h
        expr: |-
          (
            sum(rate(http_requests_total{job="checkout", handler!="/healthz", code=~"5.."}[1h]))
            or
            0 * sum(rate(http_requests_total{job="checkout", handler!="/healthz"}[1h]))
          )
          /
          sum(rate(http_requests_total{job="checkout", handler!="/healthz"}[1h]))
        labels:
          slo_service: checkout
          slo: availability
          team: payments
      - record: ftw_slo:sli_error:ratio_rate2h
        expr: |-
          (
            sum(rate(http_requests_total{job="checkout", handler!="/healthz", code=~"5.."}[2h]))
            or
            0 * sum(rate(http_requests_total{job="checkout", handler!="/healthz"}[2h]))
          )
          /
          sum(rate(http_requests_total{job="checkout", handler!="/healthz"}[2h]))
        labels:
          slo_service: checkout
          slo: availability
          team: payments
      - record: ftw_slo:sli_error:ratio_rate6h
        expr: |-
          (
            sum(rate(http_requests_total{job="checkout", handler!="/healthz", code=~"5.."}[6h]))
            or
            0 * sum(rate(http_requests_total{job="checkout", handler!="/healthz"}[6h]))
          )
          /
          sum(rate(http_requests_total{job="checkout", handler!="/healthz"}[6h]))
        labels:
          slo_service: checkout
          slo: availability
          team: payments
      - record: ftw_slo:sli_error:ratio_rate1d
        expr: |-
          (
            sum(rate(http_requests_total{job="checkout", handler!="/healthz", code=~"5.."}[1d]))
            or
            0 * sum(rate(http_requests_total{job="checkout", handler!="/healthz"}[1d]))
          )
          /
          sum(rate(http_requests_total{job="checkout", handler!="/healthz"}[1d]))
        labels:
          slo_service: checkout
          slo: availability
          team: payments
      - record: ftw_slo:sli_error:ratio_rate3d
        expr: |-
          (
            sum(rate(http_requests_total{job="checkout", handler!="/healthz", code=~"5.."}[3d]))
            or
            0 * sum(rate(http_requests_total{job="checkout", handler!="/healthz"}[3d]))
          )
          /
          sum(rate(http_requests_total{job="checkout", handler!="/healthz"}[3d]))
        labels:
          slo_service: checkout
          slo: availability
          team: payments
  - name: ftw-slo:checkout:availability:meta
    rules:
      - record: ftw_slo:sli_error:ratio_period
        expr: |-
          sum_over_time(ftw_slo:sli_errors:rate5m{slo_service="checkout", slo="availability"}[30d])
          /
          sum_over_time(ftw_slo:sli_total:rate5m{slo_service="checkout", slo="availability"}[30d])
        labels:
          slo_service: checkout
          slo: availability
          team: payments
      - record: ftw_slo:error_budget_remaining:ratio
        expr: 1 - (ftw_slo:sli_error:ratio_period{slo_service="checkout", slo="availability"} / 0.001)
        labels:
          slo_service: checkout
          slo: availability
          team: payments
      - record: ftw_slo:objective:ratio
        expr: vector(0.999)
        labels:
          slo_service: checkout
          slo: availability
          team: payments
      - record: ftw_slo:error_budget:ratio
        expr: vector(0.001)
        labels:
          slo_service: checkout
          slo: availability
          team: payments
      - record: ftw_slo:period:days
        expr: vector(30)
        labels:
          slo_service: checkout
          slo: availability
          team: payments
  - name: ftw-slo:checkout:availability:alerts
    rules:
      - alert: CheckoutAvailabilityFastBurn
        expr: |-
          (
            ftw_slo:sli_error:ratio_rate1h{slo_service="checkout", slo="availability"} > (14.4 * 0.001)
            and
            ftw_slo:sli_error:ratio_rate5m{slo_service="checkout", slo="availability"} > (14.4 * 0.001)
          )
        labels:
          severity: critical
          slo_alert: page
          notify: pagerduty
        annotations:
          summary: 'checkout availability: error budget fast burn (page)'
          description: 'The checkout availability SLO (99.9% over 30d) is consuming its error budget too fast. Firing condition(s): 1h and 5m error ratio above 14.4x the budget (whole budget gone in 2.1 days at that rate).'
          runbook_url: https://runbooks.example.com/checkout/availability
      - alert: CheckoutAvailabilitySlowBurn
        expr: |-
          (
            ftw_slo:sli_error:ratio_rate6h{slo_service="checkout", slo="availability"} > (6 * 0.001)
            and
            ftw_slo:sli_error:ratio_rate30m{slo_service="checkout", slo="availability"} > (6 * 0.001)
          )
          or
          (
            ftw_slo:sli_error:ratio_rate1d{slo_service="checkout", slo="availability"} > (3 * 0.001)
            and
            ftw_slo:sli_error:ratio_rate2h{slo_service="checkout", slo="availability"} > (3 * 0.001)
          )
          or
          (
            ftw_slo:sli_error:ratio_rate3d{slo_service="checkout", slo="availability"} > (1 * 0.001)
            and
            ftw_slo:sli_error:ratio_rate6h{slo_service="checkout", slo="availability"} > (1 * 0.001)
          )
        labels:
          severity: warning
          slo_alert: ticket
        annotations:
          summary: 'checkout availability: error budget slow burn (ticket)'
          description: 'The checkout availability SLO (99.9% over 30d) is consuming its error budget too fast. Firing condition(s): 6h and 30m error ratio above 6x the budget (whole budget gone in 5 days at that rate); 1d and 2h error ratio above 3x the budget (whole budget gone in 10 days at that rate); 3d and 6h error ratio above 1x the budget (whole budget gone in 30 days at that rate).'
          runbook_url: https://runbooks.example.com/checkout/availability
  - name: ftw-slo:checkout:latency:sli
    rules:
      - record: ftw_slo:sli_errors:rate5m
        expr: |-
          (sum(rate(http_request_duration_seconds_count{job="checkout", handler!="/healthz"}[5m])) - sum(rate(http_request_duration_seconds_bucket{job="checkout", handler!="/healthz", le="0.3"}[5m])))
          or
          0 * sum(rate(http_request_duration_seconds_count{job="checkout", handler!="/healthz"}[5m]))
        labels:
          slo_service: checkout
          slo: latency
          team: payments
      - record: ftw_slo:sli_total:rate5m
