# Prometheus rule file generated by ftw-slo 1.0.0 from api-gateway.yaml.
# Do not edit by hand: change the SLO spec and run `ftw-slo generate` again.
groups:
  - name: ftw-slo:api-gateway:availability:sli
    rules:
      - record: ftw_slo:sli_errors:rate5m
        expr: |-
          sum(rate(gateway_requests_total{env="prod", status=~"5..|429"}[5m]))
          or
          0 * sum(rate(gateway_requests_total{env="prod"}[5m]))
        labels:
          slo_service: api-gateway
          slo: availability
          team: platform
      - record: ftw_slo:sli_total:rate5m
        expr: sum(rate(gateway_requests_total{env="prod"}[5m]))
        labels:
          slo_service: api-gateway
          slo: availability
          team: platform
      - record: ftw_slo:sli_error:ratio_rate5m
        expr: |-
          ftw_slo:sli_errors:rate5m{slo_service="api-gateway", slo="availability"}
          /
          ftw_slo:sli_total:rate5m{slo_service="api-gateway", slo="availability"}
        labels:
          slo_service: api-gateway
          slo: availability
          team: platform
      - record: ftw_slo:sli_error:ratio_rate30m
        expr: |-
          (
            sum(rate(gateway_requests_total{env="prod", status=~"5..|429"}[30m]))
            or
            0 * sum(rate(gateway_requests_total{env="prod"}[30m]))
          )
          /
          sum(rate(gateway_requests_total{env="prod"}[30m]))
        labels:
          slo_service: api-gateway
          slo: availability
          team: platform
      - record: ftw_slo:sli_error:ratio_rate1h
        expr: |-
          (
            sum(rate(gateway_requests_total{env="prod", status=~"5..|429"}[1h]))
            or
            0 * sum(rate(gateway_requests_total{env="prod"}[1h]))
          )
          /
          sum(rate(gateway_requests_total{env="prod"}[1h]))
        labels:
          slo_service: api-gateway
          slo: availability
          team: platform
      - record: ftw_slo:sli_error:ratio_rate2h
        expr: |-
          (
            sum(rate(gateway_requests_total{env="prod", status=~"5..|429"}[2h]))
            or
            0 * sum(rate(gateway_requests_total{env="prod"}[2h]))
          )
          /
          sum(rate(gateway_requests_total{env="prod"}[2h]))
        labels:
          slo_service: api-gateway
          slo: availability
          team: platform
      - record: ftw_slo:sli_error:ratio_rate6h
        expr: |-
          (
            sum(rate(gateway_requests_total{env="prod", status=~"5..|429"}[6h]))
            or
            0 * sum(rate(gateway_requests_total{env="prod"}[6h]))
          )
          /
          sum(rate(gateway_requests_total{env="prod"}[6h]))
        labels:
          slo_service: api-gateway
          slo: availability
          team: platform
      - record: ftw_slo:sli_error:ratio_rate1d
        expr: |-
          (
            sum(rate(gateway_requests_total{env="prod", status=~"5..|429"}[1d]))
            or
            0 * sum(rate(gateway_requests_total{env="prod"}[1d]))
          )
          /
          sum(rate(gateway_requests_total{env="prod"}[1d]))
        labels:
          slo_service: api-gateway
          slo: availability
          team: platform
      - record: ftw_slo:sli_error:ratio_rate3d
        expr: |-
          (
            sum(rate(gateway_requests_total{env="prod", status=~"5..|429"}[3d]))
            or
            0 * sum(rate(gateway_requests_total{env="prod"}[3d]))
          )
          /
          sum(rate(gateway_requests_total{env="prod"}[3d]))
        labels:
          slo_service: api-gateway
          slo: availability
          team: platform
  - name: ftw-slo:api-gateway:availability:meta
    rules:
      - record: ftw_slo:sli_error:ratio_period
        expr: |-
          sum_over_time(ftw_slo:sli_errors:rate5m{slo_service="api-gateway", slo="availability"}[28d])
          /
          sum_over_time(ftw_slo:sli_total:rate5m{slo_service="api-gateway", slo="availability"}[28d])
        labels:
          slo_service: api-gateway
          slo: availability
          team: platform
      - record: ftw_slo:error_budget_remaining:ratio
        expr: 1 - (ftw_slo:sli_error:ratio_period{slo_service="api-gateway", slo="availability"} / 0.005)
        labels:
          slo_service: api-gateway
          slo: availability
          team: platform
      - record: ftw_slo:objective:ratio
        expr: vector(0.995)
        labels:
          slo_service: api-gateway
          slo: availability
          team: platform
      - record: ftw_slo:error_budget:ratio
        expr: vector(0.005)
        labels:
          slo_service: api-gateway
          slo: availability
          team: platform
      - record: ftw_slo:period:days
        expr: vector(28)
        labels:
          slo_service: api-gateway
          slo: availability
          team: platform
  - name: ftw-slo:api-gateway:availability:alerts
    rules:
      - alert: ApiGatewayFastBurn
        expr: |-
          (
            ftw_slo:sli_error:ratio_rate1h{slo_service="api-gateway", slo="availability"} > (13.44 * 0.005)
            and
            ftw_slo:sli_error:ratio_rate5m{slo_service="api-gateway", slo="availability"} > (13.44 * 0.005)
          )
        labels:
          severity: critical
          slo_alert: page
          notify: pagerduty
        annotations:
          summary: 'api-gateway availability: error budget fast burn (page)'
          description: 'The api-gateway availability SLO (99.5% over 28d) is consuming its error budget too fast. Firing condition(s): 1h and 5m error ratio above 13.44x the budget (whole budget gone in 2.1 days at that rate).'
          runbook_url: https://runbooks.example.com/api-gateway/availability
      - alert: ApiGatewaySlowBurn
        expr: |-
          (
            ftw_slo:sli_error:ratio_rate6h{slo_service="api-gateway", slo="availability"} > (5.6 * 0.005)
            and
            ftw_slo:sli_error:ratio_rate30m{slo_service="api-gateway", slo="availability"} > (5.6 * 0.005)
          )
          or
          (
            ftw_slo:sli_error:ratio_rate1d{slo_service="api-gateway", slo="availability"} > (2.8 * 0.005)
            and
            ftw_slo:sli_error:ratio_rate2h{slo_service="api-gateway", slo="availability"} > (2.8 * 0.005)
          )
          or
          (
            ftw_slo:sli_error:ratio_rate3d{slo_service="api-gateway", slo="availability"} > (0.933333 * 0.005)
            and
            ftw_slo:sli_error:ratio_rate6h{slo_service="api-gateway", slo="availability"} > (0.933333 * 0.005)
          )
        labels:
          severity: warning
          slo_alert: ticket
        annotations:
          summary: 'api-gateway availability: error budget slow burn (ticket)'
          description: 'The api-gateway availability SLO (99.5% over 28d) is consuming its error budget too fast. Firing condition(s): 6h and 30m error ratio above 5.6x the budget (whole budget gone in 5 days at that rate); 1d and 2h error ratio above 2.8x the budget (whole budget gone in 10 days at that rate); 3d and 6h error ratio above 0.933333x the budget (whole budget gone in 30 days at that rate).'
          runbook_url: https://runbooks.example.com/api-gateway/availability
