# Prometheus rule file generated by ftw-slo 1.0.0 from billing.yaml.
# Do not edit by hand: change the SLO spec and run `ftw-slo generate` again.
groups:
  - name: ftw-slo:billing:invoice-generation:sli
    rules:
      - record: ftw_slo:sli_errors:rate5m
        expr: |-
          sum(rate(billing_invoices_failed_total[5m]))
          or
          0 * sum(rate(billing_invoices_attempted_total[5m]))
        labels:
          slo_service: billing
          slo: invoice-generation
          team: finance-platform
      - record: ftw_slo:sli_total:rate5m
        expr: sum(rate(billing_invoices_attempted_total[5m]))
        labels:
          slo_service: billing
          slo: invoice-generation
          team: finance-platform
      - record: ftw_slo:sli_error:ratio_rate5m
        expr: |-
          ftw_slo:sli_errors:rate5m{slo_service="billing", slo="invoice-generation"}
          /
          ftw_slo:sli_total:rate5m{slo_service="billing", slo="invoice-generation"}
        labels:
          slo_service: billing
          slo: invoice-generation
          team: finance-platform
      - record: ftw_slo:sli_error:ratio_rate30m
        expr: |-
          (
            sum(rate(billing_invoices_failed_total[30m]))
            or
            0 * sum(rate(billing_invoices_attempted_total[30m]))
          )
          /
          sum(rate(billing_invoices_attempted_total[30m]))
        labels:
          slo_service: billing
          slo: invoice-generation
          team: finance-platform
      - record: ftw_slo:sli_error:ratio_rate1h
        expr: |-
          (
            sum(rate(billing_invoices_failed_total[1h]))
            or
            0 * sum(rate(billing_invoices_attempted_total[1h]))
          )
          /
          sum(rate(billing_invoices_attempted_total[1h]))
        labels:
          slo_service: billing
          slo: invoice-generation
          team: finance-platform
      - record: ftw_slo:sli_error:ratio_rate6h
        expr: |-
          (
            sum(rate(billing_invoices_failed_total[6h]))
            or
            0 * sum(rate(billing_invoices_attempted_total[6h]))
          )
          /
          sum(rate(billing_invoices_attempted_total[6h]))
        labels:
          slo_service: billing
          slo: invoice-generation
          team: finance-platform
      - record: ftw_slo:sli_error:ratio_rate3d
        expr: |-
          (
            sum(rate(billing_invoices_failed_total[3d]))
            or
            0 * sum(rate(billing_invoices_attempted_total[3d]))
          )
          /
          sum(rate(billing_invoices_attempted_total[3d]))
        labels:
          slo_service: billing
          slo: invoice-generation
          team: finance-platform
  - name: ftw-slo:billing:invoice-generation:meta
    rules:
      - record: ftw_slo:sli_error:ratio_period
        expr: |-
          sum_over_time(ftw_slo:sli_errors:rate5m{slo_service="billing", slo="invoice-generation"}[30d])
          /
          sum_over_time(ftw_slo:sli_total:rate5m{slo_service="billing", slo="invoice-generation"}[30d])
        labels:
          slo_service: billing
          slo: invoice-generation
          team: finance-platform
      - record: ftw_slo:error_budget_remaining:ratio
        expr: 1 - (ftw_slo:sli_error:ratio_period{slo_service="billing", slo="invoice-generation"} / 0.001)
        labels:
          slo_service: billing
          slo: invoice-generation
          team: finance-platform
      - record: ftw_slo:objective:ratio
        expr: vector(0.999)
        labels:
          slo_service: billing
          slo: invoice-generation
          team: finance-platform
      - record: ftw_slo:error_budget:ratio
        expr: vector(0.001)
        labels:
          slo_service: billing
          slo: invoice-generation
          team: finance-platform
      - record: ftw_slo:period:days
        expr: vector(30)
        labels:
          slo_service: billing
          slo: invoice-generation
          team: finance-platform
  - name: ftw-slo:billing:invoice-generation:alerts
    rules:
      - alert: BillingInvoicesFastBurn
        expr: |-
          (
            ftw_slo:sli_error:ratio_rate1h{slo_service="billing", slo="invoice-generation"} > (14.4 * 0.001)
            and
            ftw_slo:sli_error:ratio_rate5m{slo_service="billing", slo="invoice-generation"} > (14.4 * 0.001)
          )
          or
          (
            ftw_slo:sli_error:ratio_rate6h{slo_service="billing", slo="invoice-generation"} > (6 * 0.001)
            and
            ftw_slo:sli_error:ratio_rate30m{slo_service="billing", slo="invoice-generation"} > (6 * 0.001)
          )
        labels:
          severity: critical
          slo_alert: page
        annotations:
          summary: 'billing invoice-generation: error budget fast burn (page)'
          description: 'The billing invoice-generation SLO (99.9% over 30d) is consuming its error budget too fast. Firing condition(s): 1h and 5m error ratio above 14.4x the budget (whole budget gone in 2.1 days at that rate); 6h and 30m error ratio above 6x the budget (whole budget gone in 5 days at that rate).'
      - alert: BillingInvoicesSlowBurn
        expr: |-
          (
            ftw_slo:sli_error:ratio_rate3d{slo_service="billing", slo="invoice-generation"} > (1 * 0.001)
            and
            ftw_slo:sli_error:ratio_rate6h{slo_service="billing", slo="invoice-generation"} > (1 * 0.001)
          )
        labels:
          severity: warning
          slo_alert: ticket
        annotations:
          summary: 'billing invoice-generation: error budget slow burn (ticket)'
          description: 'The billing invoice-generation SLO (99.9% over 30d) is consuming its error budget too fast. Firing condition(s): 3d and 6h error ratio above 1x the budget (whole budget gone in 30 days at that rate).'
